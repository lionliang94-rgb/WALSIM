<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev Preview · WalpurgisNightSim</title>
    <style>
      :root {
        --bg: #0a0b10;
        --panel: #11131a;
        --panel-2: #151823;
        --panel-3: #1a1e2b;
        --border: #232838;
        --text: #e6e9f2;
        --dim: #8b93a7;
        --faint: #5c6478;
        --accent: #7c5cff;
        --accent-soft: rgba(124, 92, 255, 0.16);
        --green: #3ddc97;
        --red: #ff6b81;
        --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

      .topbar {
        height: 40px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        letter-spacing: 0.2px;
        min-width: 0;
        white-space: nowrap;
        font-size: 12.5px;
      }

      .brand .dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .brand .proj {
        color: var(--dim);
        font-weight: 400;
        font-size: 11.5px;
        padding-left: 8px;
        border-left: 1px solid var(--border);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tools { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }

      .status-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: var(--faint);
        margin-right: 1px;
      }

      .status-dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.14); }
      .status-dot.off { background: var(--red); box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.14); }

      .target-select {
        max-width: 116px;
        background: var(--panel-3);
        border: 1px solid var(--border);
        border-radius: 5px;
        color: #c6ccdb;
        font-family: var(--mono);
        font-size: 11px;
        padding: 3px 4px;
        outline: none;
      }

      .target-select option { background: var(--panel-2); color: var(--text); }

      .toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--dim);
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .toggle input { accent-color: var(--accent); margin: 0; }

      .icon-btn {
        width: 24px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        color: var(--dim);
        border: 1px solid transparent;
        text-decoration: none;
      }

      .icon-btn:hover { background: var(--panel-3); color: var(--text); border-color: var(--border); }

      .stage {
        flex: 1 1 auto;
        min-height: 0;
        padding: 8px;
        display: flex;
        justify-content: center;
        background:
          linear-gradient(0deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.28)),
          repeating-conic-gradient(#0d0f16 0% 25%, #0a0b10 0% 50%) 50% / 18px 18px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }

      .offline {
        align-self: center;
        max-width: 320px;
        text-align: center;
        color: var(--dim);
        font-size: 12.5px;
        line-height: 1.9;
      }

      .offline strong { display: block; color: var(--text); font-weight: 500; margin-bottom: 4px; }
      .offline code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
      }

      @media (max-width: 760px) {
        .brand .proj { display: none; }
        .toggle span { display: none; }
        .stage { padding: 6px; }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>Dev Preview</span>
        <span class="proj" id="proj-name">WalpurgisNightSim</span>
      </div>

      <div class="tools">
        <span class="status-dot" id="preview-dot" title="预览目标状态"></span>
        <select class="target-select" id="target-select" title="选择预览目标"></select>
        <label class="toggle" title="文件变化后自动刷新预览">
          <input type="checkbox" id="autoreload" checked />
          <span>自动刷新</span>
        </label>
        <button class="icon-btn" id="btn-reload" title="刷新预览">↻</button>
        <a class="icon-btn" id="btn-open" target="_blank" rel="noreferrer" title="在新标签页打开">↗</a>
      </div>
    </header>

    <div class="stage" id="stage">
      <iframe id="preview" title="在线预览"></iframe>
    </div>

    <script>
      const $ = (sel) => document.querySelector(sel);

      const ui = {
        preview: $("#preview"),
        stage: $("#stage"),
        dot: $("#preview-dot"),
        select: $("#target-select"),
        autoreload: $("#autoreload"),
        open: $("#btn-open"),
        proj: $("#proj-name"),
      };

      const state = {
        targets: [],
        url: "",
        autoReload: localStorage.getItem("dp.autoreload") !== "0",
      };

      function renderTargets() {
        const select = ui.select;
        if (select.options.length !== state.targets.length) {
          select.innerHTML = "";
          for (const target of state.targets) {
            const option = document.createElement("option");
            option.value = target.url;
            option.textContent = target.label;
            select.append(option);
          }
        }
        select.value = state.url;
        ui.open.href = state.url;
      }

      function reloadPreview() {
        if (!state.url) return;
        const url = new URL(state.url);
        url.searchParams.set("__t", String(Date.now()));
        ui.preview.src = url.toString();
      }

      async function checkHealth() {
        try {
          const res = await fetch("/api/preview-health?url=" + encodeURIComponent(state.url));
          const data = await res.json();
          ui.dot.className = "status-dot " + (data.ok ? "on" : "off");
          ui.dot.title = data.ok ? "预览目标可访问" : "预览目标当前不可访问";
          showOffline(!data.ok);
        } catch {
          ui.dot.className = "status-dot off";
        }
      }

      function showOffline(offline) {
        const existing = document.querySelector(".offline");
        if (!offline) {
          existing?.remove();
          ui.preview.style.display = "";
          return;
        }
        if (existing) return;
        const div = document.createElement("div");
        div.className = "offline";
        div.innerHTML =
          "<strong>预览目标连不上</strong>" +
          "先确认 dev server 在跑：<br /><code>npm run dev</code>（端口 3000）<br />" +
          "起来后点右上角 ↻ 刷新";
        ui.preview.style.display = "none";
        ui.stage.append(div);
      }

      async function boot() {
        const res = await fetch("/api/targets");
        const data = await res.json();
        state.targets = data.targets;
        state.url = data.previewUrl;
        ui.proj.textContent = data.project.split(/[\\/]/).pop();
        renderTargets();
        ui.preview.src = state.url;
        checkHealth();
      }

      ui.select.addEventListener("change", () => {
        state.url = ui.select.value;
        renderTargets();
        reloadPreview();
        checkHealth();
      });

      $("#btn-reload").addEventListener("click", () => {
        reloadPreview();
        checkHealth();
      });

      ui.autoreload.addEventListener("change", () => {
        state.autoReload = ui.autoreload.checked;
        localStorage.setItem("dp.autoreload", state.autoReload ? "1" : "0");
      });

      // 文件变化 → 自动刷新预览
      let timer = null;
      const source = new EventSource("/api/events");
      source.addEventListener("change", () => {
        if (!state.autoReload) return;
        clearTimeout(timer);
        timer = setTimeout(reloadPreview, 300);
      });

      setInterval(checkHealth, 5000);
      ui.autoreload.checked = state.autoReload;

      boot().catch((err) => {
        ui.stage.innerHTML = `<div class="offline"><strong>无法连接面板服务</strong>${err.message}</div>`;
      });
    </script>
  </body>
</html>
